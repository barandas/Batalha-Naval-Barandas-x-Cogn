spring.application.name=battleship
server.port=${PORT:8080}
spring.jackson.default-property-inclusion=always
# Behind a reverse proxy (e.g. Render), take the client IP from X-Forwarded-For sent by trusted internal proxies.
server.forward-headers-strategy=native
battleship.max-active-games=2000
battleship.create-rate-limit.capacity=10
battleship.create-rate-limit.period=1m
